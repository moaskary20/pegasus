# أضف هذا الملف داخل بلوك server في إعدادات Nginx
# مثلاً: include /path/to/pegasus/deploy/nginx-upload.conf;

# حد رفع الملفات 220 ميجا (لفيديوهات المعاينة حتى 200 ميجا)
client_max_body_size 220M;
client_body_buffer_size 220M;

# وقت انتظار الرفع (ثواني)
client_body_timeout 600;

# منع التحميل المباشر لفيديوهات /storage — البث عبر مسارات التطبيق فقط
location ~* ^/storage/.*\.(mp4|webm|mov|m4v|mkv|avi|mpeg|mpg|m3u8|ts)$ {
    return 404;
}
